apiVersion: v1
kind: Pod
metadata:
  name: direct-volume
spec:
  runtimeClassName: kata
  restartPolicy: Never
  containers:
  - name: test
    image: quay.io/prometheus/busybox:latest
    command: ["sleep", "infinity"]
    volumeMounts:
    - name: direct-volume
      mountPath: /data
  volumes:
  - name: direct-volume
    # This hostPath is only the OCI mount source used to identify the
    # direct-assigned volume. The runtime attaches and guest-mounts the block
    # device described by the corresponding mountInfo.json.
    hostPath:
      path: /tmp/kata-direct-volume-test
      type: Directory
