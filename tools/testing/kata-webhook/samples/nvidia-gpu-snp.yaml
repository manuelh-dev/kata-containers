apiVersion: v1
kind: Pod
metadata:
  name: cuda-vectoradd-kata-snp-policy-debug
  namespace: default
spec:
  runtimeClassName: kata-qemu-nvidia-gpu-snp-runtime-rs-devkit
  restartPolicy: Never
  containers:
    - name: cuda-vectoradd
      image: nvcr.io/nvidia/k8s/cuda-sample:vectoradd-cuda12.5.0-ubuntu22.04
      command:
        - /bin/sh
        - -c
        - /cuda-samples/vectorAdd && sleep 3600
      resources:
        limits:
          nvidia.com/pgpu: "1"
          memory: 16Gi
    - name: keep-sandbox-running
      image: nvcr.io/nvidia/k8s/cuda-sample:vectoradd-cuda12.5.0-ubuntu22.04
      command:
        - /bin/sh
        - -c
        - sleep 3600
