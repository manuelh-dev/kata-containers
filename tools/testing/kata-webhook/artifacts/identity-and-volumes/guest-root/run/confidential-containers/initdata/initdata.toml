'pod-spec.json' = "{\"volumes\":[{\"name\":\"work\",\"emptyDir\":{\"medium\":\"Memory\",\"sizeLimit\":\"16Mi\"}},{\"name\":\"config\",\"configMap\":{\"name\":\"policy-input-demo\",\"defaultMode\":420}},{\"name\":\"secret\",\"secret\":{\"secretName\":\"policy-input-demo\",\"defaultMode\":288}},{\"name\":\"kube-api-access-9g7m5\",\"projected\":{\"sources\":[{\"serviceAccountToken\":{\"expirationSeconds\":3607,\"path\":\"token\"}},{\"configMap\":{\"name\":\"kube-root-ca.crt\",\"items\":[{\"key\":\"ca.crt\",\"path\":\"ca.crt\"}]}},{\"downwardAPI\":{\"items\":[{\"path\":\"namespace\",\"fieldRef\":{\"apiVersion\":\"v1\",\"fieldPath\":\"metadata.namespace\"}}]}}],\"defaultMode\":420}}],\"containers\":[{\"name\":\"identity-and-volumes\",\"image\":\"quay.io/prometheus/busybox:latest\",\"command\":[\"/bin/sh\",\"-c\"],\"args\":[\"set -eu\\nid\\ntest \\\"$(cat /etc/demo-config/message)\\\" = \\\"hello-from-configmap\\\"\\ntest \\\"$(cat /etc/demo-secret/username)\\\" = \\\"demo-user\\\"\\ntest \\\"${CONFIG_MESSAGE}\\\" = \\\"hello-from-configmap\\\"\\ntest \\\"${SECRET_USERNAME}\\\" = \\\"demo-user\\\"\\nprintf '%s\\\\n' \\\"watchdog sample is running\\\" \\u003e /work/status\\nsleep 3600\\n\"],\"env\":[{\"name\":\"CONFIG_MESSAGE\",\"valueFrom\":{\"configMapKeyRef\":{\"name\":\"policy-input-demo\",\"key\":\"message\"}}},{\"name\":\"SECRET_USERNAME\",\"valueFrom\":{\"secretKeyRef\":{\"name\":\"policy-input-demo\",\"key\":\"username\"}}}],\"resources\":{\"limits\":{\"cpu\":\"100m\",\"memory\":\"64Mi\"},\"requests\":{\"cpu\":\"10m\",\"memory\":\"16Mi\"}},\"volumeMounts\":[{\"name\":\"work\",\"mountPath\":\"/work\"},{\"name\":\"config\",\"readOnly\":true,\"mountPath\":\"/etc/demo-config\"},{\"name\":\"secret\",\"readOnly\":true,\"mountPath\":\"/etc/demo-secret\"},{\"name\":\"kube-api-access-9g7m5\",\"readOnly\":true,\"mountPath\":\"/var/run/secrets/kubernetes.io/serviceaccount\"}],\"terminationMessagePath\":\"/dev/termination-log\",\"terminationMessagePolicy\":\"File\",\"imagePullPolicy\":\"Always\",\"securityContext\":{\"capabilities\":{\"drop\":[\"ALL\"]},\"readOnlyRootFilesystem\":true,\"allowPrivilegeEscalation\":false,\"seccompProfile\":{\"type\":\"RuntimeDefault\"}}}],\"restartPolicy\":\"Never\",\"terminationGracePeriodSeconds\":30,\"dnsPolicy\":\"ClusterFirst\",\"nodeSelector\":{\"amd.feature.node.kubernetes.io/snp\":\"true\",\"kata-deploy.katacontainers.io/default\":\"true\",\"katacontainers.io/kata-runtime\":\"true\",\"nvidia.com/cc.ready.state\":\"true\"},\"serviceAccountName\":\"default\",\"serviceAccount\":\"default\",\"securityContext\":{\"runAsUser\":1000,\"runAsGroup\":2000,\"supplementalGroups\":[3000,4000],\"fsGroup\":5000},\"schedulerName\":\"default-scheduler\",\"tolerations\":[{\"key\":\"node.kubernetes.io/not-ready\",\"operator\":\"Exists\",\"effect\":\"NoExecute\",\"tolerationSeconds\":300},{\"key\":\"node.kubernetes.io/unreachable\",\"operator\":\"Exists\",\"effect\":\"NoExecute\",\"tolerationSeconds\":300}],\"priority\":0,\"runtimeClassName\":\"kata-qemu-nvidia-gpu-snp-runtime-rs-devkit\",\"enableServiceLinks\":true,\"preemptionPolicy\":\"PreemptLowerPriority\",\"overhead\":{\"cpu\":\"1\",\"memory\":\"10Gi\",\"sev-snp.amd.com/esids\":\"1\"}}"
