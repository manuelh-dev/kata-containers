apiVersion: v1
kind: Namespace
metadata:
  name: kata-crd
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: csi-kata-crd
  namespace: kata-crd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: csi-kata-crd
rules:
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - persistentvolumes
  verbs:
  - create
  - get
  - list
  - watch
- apiGroups:
  - storage.k8s.io
  resources:
  - storageclasses
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - storage.katacontainers.io
  resources:
  - katavolumes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - storage.katacontainers.io
  resources:
  - katavolumes/status
  verbs:
  - get
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: csi-kata-crd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: csi-kata-crd
subjects:
- kind: ServiceAccount
  name: csi-kata-crd
  namespace: kata-crd
