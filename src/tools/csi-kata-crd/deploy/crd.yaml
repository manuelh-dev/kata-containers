apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: katavolumes.storage.katacontainers.io
spec:
  group: storage.katacontainers.io
  names:
    kind: KataVolume
    listKind: KataVolumeList
    plural: katavolumes
    singular: katavolume
    shortNames:
    - kv
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - backingClaim
            properties:
              backingClaim:
                type: string
                minLength: 1
          status:
            type: object
            properties:
              backingClaimUID:
                type: string
              devicePath:
                type: string
