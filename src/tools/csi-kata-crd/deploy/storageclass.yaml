apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: kata-crd-ext4
provisioner: crdvolume.csi.katacontainers.io
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: false
parameters:
  csi.storage.k8s.io/fstype: ext4
mountOptions:
- noatime
